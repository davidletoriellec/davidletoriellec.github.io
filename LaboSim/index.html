 /* colonne 0 = continu ; colonnes q>0 = phaseurs efficaces (réf. cosinus) à chaque fréquence/harmonique */

   if(c.type==='bat')ev[0]=c.val;else if(c.type==='ac'){if(c.val>0)ev[col(c.f)]=c.val}
   else{ev[0]=c.off;if(c.amp>0)HK(c).forEach(k=>{const q=col(c.f*k);ev[q]=(ev[q]||0)+amp(c,k)/Math.SQRT2})}

  if(c.type==='cap')return[0,w*c.val*1e-6];if(c.type==='ind'){const L=w*c.val*1e-3,r=Math.max(c.r,1e-3),d=r*r+L*L;return[r/d,-L/d]}return null};
 const n=m+src.length,X=[];
 for(let q=0;q<K;q++){const w=ws[q],Ar=Array.from({length:n},()=>new Array(n+1).fill(0)),Ai=Array.from({length:n},()=>new Array(n+1).fill(0));
  for(let i=0;i<m;i++)Ar[i][i]+=1e-9;
  const G=(a,b,gr,gi)=>{const i=ix(a),j=ix(b);if(i>=0){Ar[i][i]+=gr;Ai[i][i]+=gi}if(j>=0){Ar[j][j]+=gr;Ai[j][j]+=gi}if(i>=0&&j>=0){Ar[i][j]-=gr;Ai[i][j]-=gi;Ar[j][i]-=gr;Ai[j][i]-=gi}};
  comps.forEach(c=>{const y=Yof(c,w);if(y)G(c.id+':0',c.id+':1',y[0],y[1]);if(c.type==='scope'){G(c.id+':0',c.id+':1',1e-6,0);G(c.id+':2',c.id+':3',1e-6,0)}if(c.type==='com')G(c.id+':1',c.id+':'+(c.pos?2:0),200,0)});

  for(let c=0;c<n;c++){let p=c,best=-1;for(let r=c;r<n;r++){const v=Ar[r][c]**2+Ai[r][c]**2;if(v>best){best=v;p=r}}
   if(best<1e-24){err='Court-circuit détecté : vérifie ton câblage (ampèremètre en dérivation ?).';return}
   [Ar[c],Ar[p]]=[Ar[p],Ar[c]];[Ai[c],Ai[p]]=[Ai[p],Ai[c]];const pr=Ar[c][c],pi=Ai[c][c],den=pr*pr+pi*pi;
   for(let r=0;r<n;r++)if(r!==c){const kr=(Ar[r][c]*pr+Ai[r][c]*pi)/den,ki=(Ai[r][c]*pr-Ar[r][c]*pi)/den;if(kr||ki)for(let j=c;j<=n;j++){const a=Ar[c][j],b=Ai[c][j];Ar[r][j]-=kr*a-ki*b;Ai[r][j]-=kr*b+ki*a}}}
  const xr=[],xi=[];for(let i=0;i<n;i++){const pr=Ar[i][i],pi=Ai[i][i],den=pr*pr+pi*pi;xr.push((Ar[i][n]*pr+Ai[i][n]*pi)/den);xi.push((Ai[i][n]*pr-Ar[i][n]*pi)/den)}X[q]={r:xr,i:xi}}
 for(let k=0;k<src.length;k++){let t=0;X.forEach(x=>{t+=x.r[m+k]**2+x.i[m+k]**2});if(Math.sqrt(t)>100){err='Court-circuit détecté : courant excessif (> 100 A).';return}}

   if(y)i=[u[0]*y[0]-u[1]*y[1],u[0]*y[1]+u[1]*y[0]];else i=k<0?[0,0]:[X[q].r[m+k],X[q].i[m+k]];

   if(c.type==='watt'){const a=Vc(c.id+':1',q),b=Vc(c.id+':0',q);u=[a[0]-b[0],a[1]-b[1]]}
   if(CI){if(c.type==='pinceW'){const a=Vc(c.id+':1',q),b=Vc(c.id+':0',q);u=[a[0]-b[0],a[1]-b[1]]}else u=[0,0];i=CI[q]}

/* ---- Oscilloscope : reconstruction temporelle ---- */
function mkWave(c,ch,acOnly){const ph=c.sig[ch],cp=ch?c.cp2:c.cp1;if(cp==='GND')return()=>0;

/* S = pixels par division ; repère local : x 0..10S, y 0..8S (centre 4S) */
function traces(c,S){if(err||!c.sig)return'';let s='';const tr=c.trig===2?1:0,fT=domFreq(c.sig[tr],c.ws);let t0=0;

  else{const N=Math.max(400,Wd*2);for(let k=0;k<=N;k++)d+=(k?'L':'M')+(k*Wd/N).toFixed(1)+' '+Y(W(t0+k/N*span));s+=`<path d="${d}" stroke="${colr}" stroke-width="${S>30?2.2:1.8}" fill="none" stroke-linejoin="round"/>`}

/* ---- Dessin des appareils ---- */
const bnc=(x,y)=>`<circle cx="${x}" cy="${y}" r="16" fill="#c9ccd1" stroke="#5f646b" stroke-width="2"/><circle cx="${x}" cy="${y}" r="10" fill="#8f959d"/><circle cx="${x}" cy="${y}" r="4.5" fill="#d4af37" stroke="#7a5f00"/><rect x="${x-19}" y="${y-2.5}" width="6" height="5" fill="#5f646b"/><rect x="${x+13}" y="${y-2.5}" width="6" height="5" fill="#5f646b"/>`;
const jack=(x,y,col)=>`<circle cx="${x}" cy="${y}" r="9" fill="${col}" stroke="#4a4a4a" stroke-width="1.5"/><circle cx="${x}" cy="${y}" r="3.5" fill="#0c0c0c"/>`;

 cv.innerHTML=s;st.textContent=err||(comps.length?(pend?'Clique sur une autre prise pour finir le câble':'Simulation en cours ✓'):'Ajoute des appareils pour commencer');st.className=err?'err':'';
 const o=document.getElementById('ro'),c=comps.find(c=>c.id===sel);if(o&&c)o.textContent=(theory&&!err)?`U = ${fmt(c.Ur,'V')} · I = ${fmt(c.Ir,'A')} · P = ${fmt(c.P,'W')} (valeurs efficaces)`:'';
}
function panel(){const c=comps.find(c=>c.id===sel);
 if(!c){if(selW!==null){pn.innerHTML=(wires[selW].coax?'<b>Câble coaxial BNC–BNC</b>':'<b>Câble</b>')+(wires[selW].coax?[]:COLS).map((k,i)=>`<button class="sw" data-k="${i}" style="background:${k}"></button>`).join('')+'<button id="rs">Redresser</button><button id="dw">Supprimer</button>';
   pn.querySelectorAll('.sw').forEach(b=>b.onclick=()=>{wires[selW].col=COLS[b.dataset.k];render()});document.getElementById('dw').onclick=delSel;document.getElementById('rs').onclick=()=>{wires[selW].off=[0,0];render()}}
  else pn.textContent='Clique une prise puis une autre pour brancher un câble (BNC : centre = âme, collerette = masse ; BNC → BNC = câble coaxial). Glisse un appareil ou un câble pour le déplacer. Pince : pose-la sur un câble.';return}
 const I=INFO[c.type];let h=`<b>${c.ana?(c.type==='amp'?'Ampèremètre à aiguille':'Voltmètre à aiguille'):I.n}</b>`;
 if(I.u)h+=`<label>${I.lab||(c.type==='bat'?'Tension':'Valeur')} <input type="number" id="vi" min="0.01" ${I.max?`max="${I.max}"`:''} step="any" value="${c.val}"> ${I.u}</label>`+(I.max?`<input type="range" id="vr" min="0.5" max="${I.max}" step="0.5" value="${c.val}">`:'');

 if(c.type==='ind')h+=`<label>Résistance interne <input type="number" id="ri" min="0.01" step="any" value="${c.r}"> Ω</label>`;
 if(c.type==='bulb')h+=`<label>Tension nominale <input type="number" id="ui" min="0.1" step="any" value="${c.un}"> V</label>`;
 if(c.type==='amp'||c.type==='volt'||c.type==='pince')h+=`<button id="md">Mode : ${c.mode==='AC'?'AC ~ (eff.)':'DC ='}</button>`;
 if(c.type==='gbf')h+=`<label>Forme ${selH('wave',[['sin','Sinus'],['sq','Carré'],['tri','Triangle']],c.wave)}</label><label>Fréquence <input type="number" data-p="f" min="10" max="1000000" step="any" value="${c.f}"> Hz</label><input type="range" data-p="fl" min="1" max="6" step="0.01" value="${Math.log10(c.f)}"><label>Amplitude crête <input type="number" data-p="amp" min="0" max="12" step="0.1" value="${c.amp}"> V</label><input type="range" data-p="amp" min="0" max="12" step="0.1" value="${c.amp}"><label>Offset <input type="number" data-p="off" min="-12" max="12" step="0.1" value="${c.off}"> V</label>`;
 if(c.type==='scope')h+=scopeCtl(c)+'<button id="zm">Écran agrandi + curseurs</button>';
 if(c.ana){const R=c.type==='amp'?RA:RV,u=c.type==='amp'?'A':'V';h+=`<label>Calibre ${selH('rng',R.map(x=>[x,fmt(x,u)]),c.rng)}</label>`}
 if(c.type==='watt'||c.type==='pinceW')h+=`<label>Affichage ${selH('disp',[['W','W'],['VAr','VAr'],['PF','cos φ'],['V','V'],['A','A']],c.disp)}</label>`;
 if(c.type==='pince'||c.type==='pinceW')h+=`<button id="rv">Inverser le sens de la pince</button><span class="mut">${c.cl?'câble pincé':'pose la pince sur un câble'}</span>`;
 if(c.type==='sw')h+=`<button id="tg">${c.closed?'Ouvrir':'Fermer'}</button>`;if(c.type==='com')h+=`<button id="tg">Basculer (position ${c.pos?'B':'A'})</button>`;
 h+=`<span id="ro" class="mut"></span><button id="dl">Supprimer</button>`;pn.innerHTML=h;
 bindP(pn,c,render);
 const vi=document.getElementById('vi'),vr=document.getElementById('vr');

 if(ui)ui.oninput=()=>{const v=parseFloat(ui.value);if(v>0){c.un=v;render()}};if(md)md.onclick=()=>{c.mode=c.mode==='AC'?'DC':'AC';panel();render()};
 const rv=document.getElementById('rv');if(rv)rv.onclick=()=>{c.rev=!c.rev;render()};const zm=document.getElementById('zm');if(zm)zm.onclick=()=>openOv(c);const ri=document.getElementById('ri');if(ri)ri.oninput=()=>{const v=parseFloat(ri.value);if(v>0){c.r=v;render()}};

const pt=e=>{const p=cv.createSVGPoint();p.x=e.clientX;p.y=e.clientY;return p.matrixTransform(cv.getScreenCTM().inverse())};

 if(c){const o=comps.find(o=>o.id==c.dataset.c);pend=null;sel=o.id;selW=null;drag={o,dx:mouse.x-o.x,dy:mouse.y-o.y,moved:false};panel();return}
 pend=null;if(w){selW=+w.dataset.w;sel=null;const ww=wires[selW],pa=tp(ww.a),pb=tp(ww.b);if(pa&&pb)wd={w:ww,m:bz(pa,pb,{off:[0,0]},.5)}}else{selW=null;sel=null}panel();render()});
window.addEventListener('pointermove',e=>{if(!drag&&!pend&&!wd)return;mouse=pt(e);if(wd){wd.w.off=[(mouse.x-wd.m.x)/.75,(mouse.y-wd.m.y)/.75];render();return}
 if(drag){drag.moved=true;{const bb=geo(drag.o).b;drag.o.x=Math.max(10-bb[0],Math.min(890-bb[0]-bb[2],Math.round((mouse.x-drag.dx)/20)*20));drag.o.y=Math.max(10-bb[1],Math.min(590-bb[1]-bb[3],Math.round((mouse.y-drag.dy)/20)*20))}render()}else render()});
window.addEventListener('pointerup',()=>{wd=null;if(drag){const c=drag.o;
 if(!drag.moved){if(c.type==='sw'){c.closed=!c.closed;panel();render()}else if(c.type==='com'){c.pos=c.pos?0:1;panel();render()}
  else if(c.type==='watt'){const h=[['W',-120],['VAr',-90],['PF',-60],['V',-20],['A',10]].find(([l,x])=>drag.dx>=x&&drag.dx<=x+24&&drag.dy>=22&&drag.dy<=40);if(h){c.disp=h[0];panel();render()}}}
 else if(c.type==='pince'||c.type==='pinceW'){const k=clampOf(c);if(k){c.x=k.pt.x;c.y=k.pt.y;render()}}}
 drag=null});

function bindP(root,c,cb){root.querySelectorAll('[data-p]').forEach(el=>el.oninput=el.onchange=()=>{const p=el.dataset.p;let v=el.value;
  if(/^(DC|AC|GND|sin|sq|tri|W|VAr|PF|V|A)$/.test(v))c[p]=v;else{v=parseFloat(v);if(isNaN(v))return;
   if(p==='fl')c.f=+Math.pow(10,v).toPrecision(3);else if(p==='f')c.f=Math.min(1e6,Math.max(10,v));else if(p==='amp')c.amp=Math.min(12,Math.max(0,v));else if(p==='off')c.off=Math.min(12,Math.max(-12,v));else c[p]=v}
  root.querySelectorAll('[data-p]').forEach(o=>{if(o===el)return;const q=o.dataset.p;if(q==='f'&&p==='fl')o.value=c.f;else if(q==='fl'&&p==='f')o.value=Math.log10(c.f);else if(q===p&&o.tagName==='INPUT')o.value=c[p]});cb()});
 root.querySelectorAll('[data-b]').forEach(el=>el.onchange=()=>{c[el.dataset.b]=el.checked;cb()})}

let ovId=null,cuDrag=null;const ov=document.getElementById('ov'),ovs=document.getElementById('ovs'),ovr=document.getElementById('ovr'),ovctl=document.getElementById('ovctl');

function renderOv(){const c=comps.find(c=>c.id===ovId);if(!c){closeOv();return}const S=60,cu=c.cur,vd=c.cch===2?c.v2:c.v1,pos=c.cch===2?c.pos2:c.pos1;
 const gr=[...Array(11)].map((_,i)=>`M${i*S} 0V480`).join('')+[...Array(9)].map((_,j)=>`M0 ${j*S}H600`).join('');

 ovs.innerHTML=`<rect width="640" height="520" fill="#0a0f0c" rx="8"/><g transform="translate(20 20)"><rect width="600" height="480" fill="#06100a" stroke="#555"/><path d="${gr}" stroke="rgba(120,200,140,.3)" fill="none"/><path d="M300 0V480M0 240H600" stroke="rgba(120,200,140,.6)" fill="none"/>${traces(c,S)}${ln('x1',cu.x1,'#ff9800')}${ln('x2',cu.x2,'#ff5722')}${ln('y1',cu.y1,'#e040fb')}${ln('y2',cu.y2,'#7c4dff')}</g>`;
 const dT=Math.abs(cu.x2-cu.x1)*c.td,V=y=>(y-pos)*vd;
 ovr.innerHTML=`<div>T1 = <b>${fmt(cu.x1*c.td,'s')}</b> · T2 = <b>${fmt(cu.x2*c.td,'s')}</b> · ΔT = <b>${fmt(dT,'s')}</b>${dT>0?` · 1/ΔT = <b>${fmt(1/dT,'Hz')}</b>`:''}</div><div>V1 = <b>${fmt(V(cu.y1),'V')}</b> · V2 = <b>${fmt(V(cu.y2),'V')}</b> · ΔV = <b>${fmt(Math.abs(cu.y2-cu.y1)*vd,'V')}</b> <span class="mut">(CH${c.cch===2?2:1})</span></div><div class="mut">Valeur max : place V1 sur le sommet de la courbe. Déphasage : φ = 360° × Δt / T, avec Δt entre deux passages par zéro (un de chaque voie) et T la période.</div>`}
