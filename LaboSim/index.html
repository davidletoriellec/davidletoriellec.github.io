<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LaboSim – Labo d’électricité</title>
<link rel="stylesheet" href="css/style.css"></head><body>
<header>
<button id="mb" title="Matériel">☰</button>
<h1>⚡ LaboSim <small class="mut">v1.4</small></h1>
<span class="sp"></span>
<label class="mut"><input type="checkbox" id="th"> Valeurs théoriques</label>
<button id="sv_">💾 Enregistrer</button><button id="op_">📂 Ouvrir</button><input type="file" id="fl" accept=".json,application/json" style="display:none"><button id="snd" title="Son des relais">🔊</button><button id="nb">📖 Notice</button><button id="pb">📄 Export PDF</button><button id="clr">Vider</button>
</header>
<div id="wrap">
<aside id="side"><div id="menu"></div><h3>Exemples</h3><button id="ex">Courant continu</button><button id="ex2">Alternatif + R</button><button id="ex3">Wattmètre R-L</button><button id="ex4">GBF + oscilloscope</button><button id="ex5">Pinces</button><button id="ex6">Relais</button><button id="ex7">Moteur monophasé</button><button id="ex8">Triphasé</button></aside>
<main>
<svg id="cv" viewBox="0 0 900 600" preserveAspectRatio="xMidYMid meet"></svg>
<footer><span id="st"></span><div id="pn" class="mut"></div></footer>
</main>
</div>
<div id="ov"><div><div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><b>Oscilloscope – écran agrandi et curseurs</b><span><button id="ovp">📄 Export PDF</button> <button id="ovc">Fermer</button></span></div><div id="ovctl"></div><svg id="ovs" viewBox="0 0 640 520"></svg><div id="ovr" class="mut"></div></div></div>
<div id="nov"><div><div style="display:flex;justify-content:space-between;align-items:center"><b>Notice d’utilisation</b><button id="novc">Fermer</button></div><div id="novb"></div></div></div>
<div id="pdfm"><div><b>Export PDF</b><div class="g2"><label>NOM <input id="pf_nom"></label><label>PRÉNOM <input id="pf_pre"></label><label>GROUPE <input id="pf_grp"></label><label>RESSOURCE <input id="pf_res"></label></div><label>Notes / énoncé / questions<textarea id="pf_txt" rows="6"></textarea></label><div style="display:flex;gap:8px"><button id="pf_go" class="p">Générer le PDF</button><button id="pf_x">Annuler</button></div><div id="pf_msg" class="mut"></div></div></div>
<script src="js/app.js"></script></body></html>
