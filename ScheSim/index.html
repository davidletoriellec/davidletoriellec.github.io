e.innerHTML='<svg viewBox="0 0 110 60" width="104" height="57">'+drawItem({id:"tmp",type:k,x:60,y:30},{},{km:false,coil:{},lamp:{}})+'</svg><small>'+TY[k].n+' '+TY[k].s+'</small>';p.appendChild(e)}P=Q}
function modeUI(){document.getElementById("bE").className=mode=="E"?"on":"";document.getElementById("bS").className=mode=="S"?"on":"";
document.getElementById("palc").style.display=mode=="E"&&ex>0?"":"none";
document.getElementById("hint").textContent=mode=="E"?"Édition : touchez une borne puis une autre pour tirer un fil (touchez un fil pour le supprimer). Faites glisser un composant pour le déplacer ; touchez-le pour le sélectionner.":"Simulation : maintenez un bouton pour l'actionner ; touchez Q1, AU ou le contact 95-96 du thermique pour les basculer. Jaune = actif."}
function setMode(m){mode=m;pend=null;if(m=="S")st={Q:st.Q,km:0,F:0,T:0};sel=null;modeUI();sync()}
var sch=document.getElementById("sch");
function pt(e){var v=sch.querySelector("svg"),p=v.createSVGPoint();p.x=e.clientX;p.y=e.clientY;var q=p.matrixTransform(v.getScreenCTM().inverse());return[q.x,q.y]}
function snap(v,a,b){return Math.max(a,Math.min(b,Math.round(v/10)*10))}
function place(k,p){var id=k+(++seq);items.push({id:id,type:k,x:snap(p[0],330,620),y:snap(p[1],80,500)});selT=null;pal();msg("");sync()}
sch.addEventListener("pointerdown",function(e){
if(mode=="S"){var h=e.target.closest("[data-hold]");if(h){held[h.dataset.hold]=1;st[h.dataset.hold]=1;lastAct=actLabel(h.dataset.hold);sync()}return}
if(e.target.closest("[data-t]"))return;var g=e.target.closest("[data-item]");
if(g){var it=items.filter(function(x){return x.id==g.dataset.item})[0],p=pt(e);drag={id:it.id,dx:it.x-p[0],dy:it.y-p[1],x0:e.clientX,y0:e.clientY,mv:false}}});
document.addEventListener("pointermove",function(e){if(!drag)return;
if(!drag.mv&&Math.abs(e.clientX-drag.x0)+Math.abs(e.clientY-drag.y0)>6)drag.mv=true;
if(drag.mv){var it=items.filter(function(x){return x.id==drag.id})[0],p=pt(e);it.x=snap(p[0]+drag.dx,330,620);it.y=snap(p[1]+drag.dy,80,500);sel=it.id;sync()}});
function up(){var ch=0;for(var k in held){st[k]=0;lastAct=actLabel(k);ch=1}held={};
if(drag){if(!drag.mv)sel=sel==drag.id?null:drag.id;drag=null;ch=1}if(ch)sync()}
document.addEventListener("pointerup",up);document.addEventListener("pointercancel",up);
sch.addEventListener("click",function(e){var t=e.target.closest("[data-t],[data-w],[data-tog],[data-ws]");if(!t)return;
if(mode=="S"){if(t.dataset.tog){var k=t.dataset.tog;st[k]=st[k]?0:1;lastAct=actLabel(k);sync()}return}
if(t.dataset.w!==undefined){W.splice(+t.dataset.w,1);msg("");sync()}
else if(t.dataset.t){var id=t.dataset.t;if(!pend)pend=id;else{if(pend!=id&&!W.some(function(w){return w[0]==pend&&w[1]==id||w[0]==id&&w[1]==pend}))W.push([pend,id]);pend=null;msg("")}sync()}
else if(t.dataset.ws){if(selT)place(selT,pt(e));else{sel=null;sync()}}});
sch.addEventListener("dragover",function(e){e.preventDefault()});
sch.addEventListener("drop",function(e){e.preventDefault();var k=e.dataTransfer.getData("text/plain");if(TY[k]&&mode=="E"&&ex>0)place(k,pt(e))});
var pl=document.getElementById("pal");
pl.addEventListener("click",function(e){var t=e.target.closest(".tile");if(!t)return;selT=selT==t.dataset.k?null:t.dataset.k;pal()});
pl.addEventListener("dragstart",function(e){var t=e.target.closest(".tile");if(t)e.dataTransfer.setData("text/plain",t.dataset.k)});
document.getElementById("bE").onclick=function(){setMode("E")};document.getElementById("bS").onclick=function(){setMode("S")};
document.getElementById("del").onclick=function(){if(!sel)return;var p=sel+".";items=items.filter(function(x){return x.id!=sel});W=W.filter(function(w){return w[0].indexOf(p)!=0&&w[1].indexOf(p)!=0});sel=null;msg("");sync()};
function ids(t){return items.filter(function(x){return x.type==t}).map(function(x){return x.id})}
function stepsFor(need){var sc=[],S=ids("start"),T=ids("stop"),PD=ids("pedal"),AU=ids("au"),pre=need.pedal?[[PD.map(function(i){return[i,1]}),0,"appui sur la pédale"]]:[],L=function(i){return lab(items.filter(function(x){return x.id==i})[0])};
function run(a){return pre.concat(a)}
S.forEach(function(a){T.forEach(function(b){sc.push(run([[[[a,1]],1,"appui sur "+L(a)],[[[a,0]],1,"relâchement de "+L(a)+" (auto-maintien)"],[[[b,1]],0,"appui sur "+L(b)],[[[b,0]],0,"relâchement de "+L(b)]]))})});
var a0=S[0];if(a0){var go=[[[a0,1]],1,"appui sur "+L(a0)],rl=[[[a0,0]],1,"relâchement de "+L(a0)];
AU.forEach(function(u){sc.push(run([go,rl,[[[u,1]],0,"arrêt d'urgence"],[[[u,0]],0,"déverrouillage de l'arrêt d'urgence"],go,rl]))});
if(need.th){sc.push(run([go,rl,[[["T",1]],0,"déclenchement du relais thermique"],[[["T",0]],0,"réarmement du thermique"]]));sc.push(run([[[["T",1]],0,"déclenchement du thermique"],[[[a0,1]],0,"appui sur "+L(a0)+" thermique déclenché"],[[[a0,0]],0,"relâchement"]]))}
if(need.pedal)PD.forEach(function(p){sc.push([[[[a0,1]],0,"Marche sans la pédale"],[[[a0,0]],0,"relâchement de Marche"],[[[p,1]],0,"appui sur la pédale"],[[[a0,1]],1,"Marche pédale appuyée"],[[[a0,0]],1,"relâchement de Marche"],[[[p,0]],0,"relâchement de la pédale"]])})}
return sc}
function check(){var need=EX[ex].need;
if(!need){var sc=[[[["Q",1]],0,"fermeture de Q1"],[[["F",1]],1,"contacteur actionné (Forcer)"],[[["F",0]],0,"contacteur relâché"],[[["Q",0]],0,"ouverture de Q1"],[[["F",1]],0,"Q1 ouvert et contacteur actionné"]],s={Q:0,km:0,F:0,T:0},r=solve(s,W,items);
if(r.short)return"Court-circuit détecté.";
for(var j=0;j<sc.length;j++){sc[j][0].forEach(function(c){s[c[0]]=c[1]});r=solve(s,W,items);s.km=r.km?1:0;if(r.short)return"Court-circuit après « "+sc[j][2]+" ».";if(r.motor!=!!sc[j][1])return"Après « "+sc[j][2]+" » : le moteur devrait "+(sc[j][1]?"tourner.":"être à l'arrêt.")}return null}
for(var k in need){var n=ids(k).length;if(n<need[k])return"Il manque : "+(need[k]-n)+" × "+NM[k]+"."}
if(!ids("coil").length)return"Il manque : la bobine KM1.";if(!ids("kmno").length)return"Il manque : le contact KM1 13-14 (NO) pour l'auto-maintien.";
var scs=stepsFor(need);
for(var i=0;i<scs.length;i++){var s={Q:1,km:0,F:0,T:0},r=solve(s,W,items);if(r.short)return"Court-circuit détecté dès le départ.";
for(var j=0;j<scs[i].length;j++){scs[i][j][0].forEach(function(c){s[c[0]]=c[1]});r=solve(s,W,items);s.km=r.km?1:0;var e=!!scs[i][j][1],d=scs[i][j][2];
if(r.short)return"Court-circuit après « "+d+" ».";
if(r.km!=e)return"Après « "+d+" » : KM1 devrait "+(e?"être collé.":"être retombé.");
if(need.lamp&&r.al!=e)return"Après « "+d+" » : le voyant H1 devrait être "+(e?"allumé.":"éteint.");
if(r.motor!=e)return"Après « "+d+" » : le moteur devrait "+(e?"tourner (vérifiez la puissance).":"être à l'arrêt.")}}return null}
document.getElementById("chk").onclick=function(){var e=check();if(e)msg("✘ "+e,"ko");else msg("✔ Correct : le montage se comporte comme attendu, sans court-circuit.","ok")};
document.getElementById("rst").onclick=function(){load(ex)};
document.getElementById("sol").onclick=function(){var n=EX[ex].need,g=n?genSol(n):{items:[],wires:[]};items=g.items;W=PW.concat(g.wires);seq=100;sel=null;msg("");sync()};
function load(i){ex=i;mode="E";pend=null;sel=null;selT=null;seq=0;st={Q:i>=1?1:0,km:0,F:0,T:0};items=[];W=i>=1?PW.slice():[];

document.getElementById("ex").value=i;document.getElementById("cons").textContent=EX[i].c;msg("");pal();modeUI();sync()}
var sl=document.getElementById("ex");EX.forEach(function(x,i){var o=document.createElement("option");o.value=i;o.textContent=x.t;sl.appendChild(o)});
sl.onchange=function(){load(+sl.value)};
load(0);
</script>
