<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Régime TT – Défaut d’isolement</title>
<style>
:root{--bg:#fafaf8;--card:#fff;--fg:#1d1d1b;--mut:#666;--bd:#d8d6cf;--ac:#1f5fbf;--bad:#c62828;--ok:#2e7d32;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161615;--card:#201f1e;--fg:#ecebe6;--mut:#a09e96;--bd:#3a3937;--ac:#7fb0ff;--bad:#ff6b6b;--ok:#6fcf74}}
:root[data-theme="dark"]{--bg:#161615;--card:#201f1e;--fg:#ecebe6;--mut:#a09e96;--bd:#3a3937;--ac:#7fb0ff;--bad:#ff6b6b;--ok:#6fcf74}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 system-ui,sans-serif}
main{max-width:1000px;margin:0 auto;padding:14px}
h1{font-size:20px;margin:0 0 4px}h2{font-size:15px;margin:0 0 8px}
.sub{color:var(--mut);margin:0 0 12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px;margin-bottom:12px}
.grid{display:grid;gap:12px;grid-template-columns:1fr}
@media(min-width:820px){.grid{grid-template-columns:1.25fr 1fr}}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:6px 0}
label{display:flex;gap:6px;align-items:center}
input[type=text],input[type=number],select,textarea{background:var(--bg);color:var(--fg);border:1px solid var(--bd);border-radius:6px;padding:6px;font:inherit;max-width:100%}
input[type=number]{width:90px}input[type=text]{flex:1;min-width:110px}textarea{width:100%;min-height:70px}
button{background:var(--ac);color:var(--bg);border:0;border-radius:6px;padding:8px 12px;font:inherit;cursor:pointer}
button.sec{background:transparent;color:var(--fg);border:1px solid var(--bd)}
#sch{overflow-x:auto}#sch svg{width:100%;min-width:520px;height:auto}
.meter{font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{border-bottom:1px solid var(--bd);padding:4px;text-align:left}
.wrap{overflow-x:auto}.msg{margin-top:8px;padding:8px;border-radius:6px;border:1px solid var(--bd)}
a.btn{display:inline-block;background:var(--ac);color:var(--bg);border-radius:6px;padding:8px 12px;text-decoration:none}.ok{color:var(--ok)}.bad{color:var(--bad)}.banner{color:var(--bad);font-weight:600;min-height:20px}
.banner.blink{font-size:18px;padding:8px;border:2px solid var(--bad);border-radius:6px;animation:bl 0.8s ease-in-out infinite}
@keyframes bl{0%,100%{opacity:1}50%{opacity:.1}}
@media (prefers-reduced-motion:reduce){.banner.blink{animation:none;background:var(--bad);color:var(--bg)}}
</style></head><body><main>
<h1>Régime TT : défaut d’isolement</h1>
<p class="sub">Réseau 230/400 V, appareil monophasé (phase L1 + neutre N). Règle les résistances, provoque un défaut, mesure, puis conclus : est-ce dangereux ?</p>

<p id="res" hidden><a id="resl" class="btn" target="_blank" rel="noopener">Ressource</a></p>
<div class="card"><h2>Étudiant</h2><div class="row">
<input type="text" id="nom" placeholder="Nom"><input type="text" id="pre" placeholder="Prénom"><input type="text" id="grp" placeholder="Groupe"></div></div>

<div class="grid"><div>
<div class="card"><h2>Schéma</h2><div id="sch"></div><div class="banner" id="ban"></div></div>
</div><div>
<div class="card"><h2>1. Montage</h2>
<div class="row"><label>RB (terre du neutre) <input type="number" id="rb" value="10" min="0.1" step="any"> Ω</label></div>
<div class="row"><label>RA (terre des masses) <input type="number" id="ra" value="20" min="0.1" step="any"> Ω</label></div>
<div class="row"><label>Rhomme <input type="number" id="rh" value="1000" min="1" step="any"> Ω</label></div>
<div class="row"><label>Protection différentielle
<select id="ddr"><option value="0">Aucune</option><option value="0.03">30 mA</option><option value="0.3">300 mA</option><option value="1">1 A</option></select></label> <button id="dcb" class="sec" hidden>Fermer le DDR</button></div>
<div class="row"><label><input type="checkbox" id="pe" checked> Carcasse reliée à RA (conducteur PE)</label></div>
<div class="row"><label><input type="checkbox" id="man"> Une personne touche la carcasse</label></div>
<div class="row"><label><input type="checkbox" id="fault"> Défaut d’isolement (L1 → carcasse)</label></div>
<div class="row"><label><input type="checkbox" id="rdon"> Résistance de défaut Rd (rouille, saleté, peinture…)</label> <label><input type="number" id="rdv" value="50" min="0" step="any"> Ω</label></div></div>

<div class="card"><h2>2. Mesures</h2>
<div class="row"><label>Voltmètre <select id="vsel"><option value="uc">Carcasse – terre</option><option value="ub">Aux bornes de RB</option><option value="ul">L1 – carcasse</option></select></label><button id="bv">Mesurer</button></div>
<div class="row"><label>Ampèremètre <select id="asel"><option value="id">Courant de défaut Id (dans RB)</option><option value="ia">Courant dans RA</option><option value="ih">Courant dans la personne</option></select></label><button id="ba">Mesurer</button></div>
<div class="meter" id="rd">—</div>
<div class="wrap"><table><thead><tr><th>Appareil</th><th>Point</th><th>Valeur</th><th>Configuration</th></tr></thead><tbody id="log"></tbody></table></div>
<div class="row"><button class="sec" id="clr">Effacer les mesures</button></div></div>
</div></div>

<div class="card"><h2>3. Conclusion</h2>
<div class="row"><input type="text" id="qst" placeholder="Question / essai traité (ex. : Question 2, essai 3)"></div>
<div class="row"><label><input type="radio" name="v" value="1"> Dangereux</label><label><input type="radio" name="v" value="0"> Pas dangereux</label></div>
<textarea id="com" placeholder="Justifie ta réponse avec tes mesures."></textarea>
<div class="row"><button id="pdf">Exporter en PDF</button><button id="chk" class="sec" hidden>Corrigé (enseignants)</button></div>
<div id="fb" class="msg" hidden></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
const $=id=>document.getElementById(id),U0=230,UL=50;
let dc=false;
const fdd=d=>d>=1?d+' A':d*1000+' mA';
const RESSOURCE_URL="https://moodle.univ-lille.fr/course/view.php?id=57483",RESSOURCE_TITRE="Ressource du cours (Moodle)";
if(RESSOURCE_URL){const a=$('resl');a.href=RESSOURCE_URL;a.textContent=RESSOURCE_TITRE;$('res').hidden=false}
const S=()=>({rb:Math.max(+$('rb').value||0.1,0.01),ra:Math.max(+$('ra').value||0.1,0.01),rh:Math.max(+$('rh').value||1,0.01),ddr:+$('ddr').value,pe:$('pe').checked,man:$('man').checked,fault:$('fault').checked,open:+$('ddr').value>0&&!dc,rdon:$('rdon').checked,rd:$('rdon').checked?Math.max(+$('rdv').value||0,0):0});
function calc(s){const r={Id:0,Ia:0,Ih:0,Ub:0,Uc:0,Ud:0,float:false,trip:false,danger:false};
 if(s.open){r.open=true;return r}
 if(!s.fault)return r;
 const g=(s.pe?1/s.ra:0)+(s.man?1/s.rh:0);
 if(!g){r.float=true;r.Uc=U0;r.danger=true;return r}
 const rp=1/g;r.Id=U0/(s.rb+s.rd+rp);r.Uc=r.Id*rp;r.Ub=r.Id*s.rb;r.Ud=r.Id*s.rd;r.Ia=s.pe?r.Uc/s.ra:0;r.Ih=s.man?r.Uc/s.rh:0;
 r.trip=s.ddr>0&&r.Id>=s.ddr;r.danger=r.Uc>UL&&!r.trip;return r}
const fa=a=>a<1?(a*1000).toFixed(a<0.01?2:1)+' mA':a.toFixed(2)+' A',fv=v=>v.toFixed(1)+' V';
const cfg=s=>`PE ${s.pe?'oui':'non'}, personne ${s.man?'oui':'non'}, défaut ${s.fault?'oui'+(s.rdon?' avec Rd = '+s.rd+' Ω':''):'non'}, DDR ${s.ddr?fdd(s.ddr):'aucun'}`;

function svg(fg,bg){const s=S(),r=calc(s),on=s.fault,R='#d32f2f',dd=s.ddr>0;let o='';
 const L=(a,b,c,d,col=fg,w=2,da)=>o+=`<line x1="${a}" y1="${b}" x2="${c}" y2="${d}" stroke="${col}" stroke-width="${w}"${da?` stroke-dasharray="${da}"`:''}/>`;
 const T=(x,y,t,col=fg,an='start')=>o+=`<text x="${x}" y="${y}" fill="${col}" text-anchor="${an}">${t}</text>`;
 const RS=(x,y,t)=>{o+=`<rect x="${x-9}" y="${y}" width="18" height="26" fill="${bg}" stroke="${fg}" stroke-width="2"/>`;T(x+14,y+17,t)};
 const gnd=x=>{L(x-12,480,x+12,480);L(x-8,486,x+8,486);L(x-4,492,x+4,492)};
 const pole=(x,y0,col=fg,w=2)=>{if(dd&&s.open){L(x,y0,x,170,col,w);L(x,210,x-9,170,col,w);L(x,210,x,300,col,w)}else L(x,y0,x,300,col,w)};
 o+=`<circle cx="30" cy="82" r="24" fill="none" stroke="${fg}" stroke-width="2"/><circle cx="54" cy="82" r="24" fill="none" stroke="${fg}" stroke-width="2"/>`;L(54,58,54,40);L(54,106,54,115);T(42,128,'Transfo',fg,'middle');
 [['L1',40],['L2',65],['L3',90],['N',115]].forEach(([n,y])=>{L(72,y,640,y);T(648,y+4,n)});
 L(130,115,130,290);L(130,316,130,480);RS(130,290,'RB');
 L(130,480,600,480,'#888',1.5,'5 4');T(610,484,'Sol','#888');gnd(130);
 pole(340,40);pole(370,115);
 if(dd){L(335,190,400,190,fg,1.5,'4 3');L(400,190,400,215,fg,1.5,'4 3');
  o+=`<rect x="391" y="215" width="18" height="26" rx="4" fill="none" stroke="${fg}" stroke-width="2"/><ellipse cx="355" cy="258" rx="32" ry="9" fill="none" stroke="${fg}" stroke-width="2.5"/>`;
  L(386,256,400,241,fg,1.5);T(418,176,'Disj. diff.');T(418,192,fdd(s.ddr))}
 o+=`<rect x="300" y="300" width="160" height="100" rx="4" fill="none" stroke="${on&&!r.float&&!s.open?R:'#e0a800'}" stroke-width="4"/>`;
 const cc=on&&!r.float&&!s.open?R:'#e0a800';
 L(340,300,340,326);L(370,300,370,326);o+=`<circle cx="355" cy="350" r="28" fill="none" stroke="${fg}" stroke-width="2"/><text x="355" y="354" fill="${fg}" font-size="11" text-anchor="middle">Appareil</text>`;
 if(on){o+=s.rdon?`<path d="M340 308 L318 308 L318 312 M318 338 L318 345 L300 345" fill="none" stroke="${R}" stroke-width="2.5"/><rect x="309" y="312" width="18" height="26" fill="${bg}" stroke="${R}" stroke-width="2"/>`:`<path d="M340 310 Q316 312 300 345" fill="none" stroke="${R}" stroke-width="2.5"/>`;o+=`<circle cx="300" cy="345" r="5" fill="${R}"/>`;if(s.rdon)T(292,322,'Rd',R,'end');T(292,340,'contact',R,'end');T(292,355,'accidentel',R,'end')}
 o+=`<circle cx="300" cy="388" r="5" fill="${cc}"/>`;T(290,386,'carcasse',cc,'end');T(290,401,'métallique',cc,'end');
 L(380,400,380,415);if(s.pe)L(380,415,380,430);else L(380,415,396,428);
 L(380,430,380,438);RS(380,438,'RA');L(380,464,380,480);gnd(380);
 o+=`<g opacity="${s.man?1:0.4}" stroke="${fg}" stroke-width="2" fill="none"><circle cx="560" cy="335" r="11"/><line x1="560" y1="346" x2="560" y2="355"/>${s.man?'<line x1="560" y1="355" x2="460" y2="355"/>':''}<rect x="551" y="355" width="18" height="40" fill="${bg}"/><line x1="560" y1="395" x2="545" y2="480"/><line x1="560" y1="395" x2="575" y2="480"/></g>`;
 T(582,380,'Rhomme');
 if(on&&!s.open){const w=4;
  o+=s.rdon?`<path d="M340 300 L340 308 L318 308 L318 312 M318 338 L318 345 L300 345" fill="none" stroke="${R}" stroke-width="4"/><rect x="309" y="312" width="18" height="26" fill="none" stroke="${R}" stroke-width="3"/>`:`<path d="M340 300 L340 310 Q316 312 300 345" fill="none" stroke="${R}" stroke-width="4"/>`;
  L(72,40,340,40,R,w);pole(340,40,R,w);
  if(!r.float){L(72,115,130,115,R,w);L(130,115,130,290,R,w);L(130,316,130,480,R,w);
   const xm=Math.max(s.pe?380:0,s.man?575:0);L(130,480,xm,480,R,w);
   if(s.pe){L(380,400,380,438,R,w);L(380,464,380,480,R,w)}
   if(s.man){L(460,355,560,355,R,w);L(560,355,560,395,R,w);L(560,395,545,480,R,w);L(560,395,575,480,R,w)}}
  else T(470,375,'carcasse à 230 V',R)}
 return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 520" font-family="sans-serif" font-size="13">${o}</svg>`}

const col=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
function draw(){$('sch').innerHTML=svg(col('--fg'),col('--card'));const s=S(),r=calc(s);
 $('dcb').hidden=!(+$('ddr').value>0);$('ban').classList.toggle('blink',s.fault&&r.trip&&!s.open);$('dcb').textContent=dc?'Ouvrir le DDR':'Fermer le DDR';
 $('ban').textContent=s.open?(s.fault?'Le DDR est ouvert : le courant ne peut pas passer. Ferme-le pour mettre l’appareil sous tension.':'Le DDR est ouvert : ferme-le pour alimenter l’appareil.'):s.fault&&r.trip?'Le différentiel déclenche : coupure automatique du circuit.':s.fault&&r.float?'Carcasse isolée de la terre : aucun courant, mais elle est sous tension.':''}
const log=[];
function meas(kind){const s=S(),r=calc(s);let name,val;
 if(kind==='v'){const k=$('vsel').value;name=$('vsel').selectedOptions[0].text;val=fv(k==='uc'?r.Uc:k==='ub'?r.Ub:(s.open?0:s.fault?r.Ud:U0));log.push(['Voltmètre',name,val,cfg(s)])}
 else{const k=$('asel').value;name=$('asel').selectedOptions[0].text;val=fa(k==='id'?r.Id:k==='ia'?r.Ia:r.Ih);log.push(['Ampèremètre',name,val,cfg(s)])}
 $('rd').textContent=val;rlog()}
function rlog(){$('log').innerHTML=log.map(l=>'<tr>'+l.map(c=>`<td>${c}</td>`).join('')+'</tr>').join('')}
function expl(){const s=S(),r=calc(s),a=[];
 if(s.open)return['Le DDR est ouvert : aucun courant ne peut circuler dans l’appareil.'];
 if(!s.fault)return['Aucun défaut : aucun courant ne circule et la carcasse est au potentiel de la terre.'];
 if(r.float)return['La carcasse n’est reliée à aucune terre : aucun courant de défaut ne circule, mais la carcasse est portée à 230 V par rapport au sol. Une personne qui la touche ferme le circuit : situation dangereuse.'];
 const rp=1/((s.pe?1/s.ra:0)+(s.man?1/s.rh:0));
 a.push(`Le courant de défaut se reboucle par le sol : Id = U0 / (RB${s.rdon?' + Rd':''} + R) = 230 / (${s.rb}${s.rdon?' + '+s.rd:''} + ${rp.toFixed(2)}) = ${fa(r.Id)}, avec R la résistance équivalente entre carcasse et terre.`);
 a.push(`Tension de contact : Uc = Id × R = ${fv(r.Uc)}${s.man?`, courant dans la personne Ih = ${fa(r.Ih)}`:''}. Seuil de sécurité : ${UL} V.`);
 if(s.ddr)a.push(r.trip?`Id (${fa(r.Id)}) dépasse le seuil du différentiel (${fdd(s.ddr)}) : il déclenche et coupe le défaut. Condition TT : RA ≤ 50 / IΔn = ${(UL/s.ddr).toFixed(0)} Ω.`:`Id (${fa(r.Id)}) est inférieur au seuil du différentiel (${fdd(s.ddr)}) : il ne déclenche pas.`);
 else a.push('Aucun différentiel : en TT, le courant de défaut est limité par RB et RA et est souvent trop faible pour faire déclencher un disjoncteur.');
 a.push(r.danger?'Conclusion : tension de contact supérieure à 50 V sans coupure : DANGEREUX.':r.trip?'Conclusion : coupure automatique, situation non dangereuse.':'Conclusion : tension de contact inférieure à 50 V : non dangereux.');return a}
$('chk').onclick=()=>{const v=document.querySelector('input[name=v]:checked'),f=$('fb');f.hidden=false;
 if(!v){f.textContent='Choisis d’abord Dangereux ou Pas dangereux.';return}
 const ok=(v.value==='1')===calc(S()).danger;f.className='msg '+(ok?'ok':'bad');f.innerHTML=(ok?'Bonne réponse. ':'Réponse incorrecte. ')+expl().join(' ')};
$('bv').onclick=()=>meas('v');$('ba').onclick=()=>meas('a');$('clr').onclick=()=>{log.length=0;rlog();$('rd').textContent='—'};
$('ddr').addEventListener('input',()=>{dc=false});$('dcb').onclick=()=>{dc=!dc;draw()};
['rb','ra','rh','rdv','rdon','ddr','pe','man','fault'].forEach(i=>$(i).addEventListener('input',draw));
matchMedia('(prefers-color-scheme:dark)').addEventListener('change',draw);draw();
const hp=()=>{$('chk').hidden=location.hash!=='#prof';if($('chk').hidden)$('fb').hidden=true};hp();addEventListener('hashchange',hp);

const cl=t=>String(t).replace(/Ω/g,' ohms').replace(/IΔn/g,'IDn').replace(/[’‘]/g,"'").replace(/[–—]/g,'-').replace(/≤/g,'<=').replace(/→/g,'->').replace(/⚡/g,'');
function png(){return new Promise((res,rej)=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas');c.width=1400;c.height=1040;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,1400,1040);x.drawImage(im,0,0,1400,1040);res(c.toDataURL('image/png'))};im.onerror=rej;
 im.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg('#000','#fff').replace('<svg ','<svg width="1400" height="1040" '))})}
$('pdf').onclick=async()=>{const n=$('nom').value.trim(),p=$('pre').value.trim(),g=$('grp').value.trim();
 if(!n||!p||!g){alert('Renseigne ton nom, ton prénom et ton groupe.');return}
 try{const d=new window.jspdf.jsPDF({unit:'mm',format:'a4'});let y=16;
  const W=(t,sz=10,b=false)=>{d.setFont('helvetica',b?'bold':'normal');d.setFontSize(sz);d.splitTextToSize(cl(t),180).forEach(l=>{if(y>280){d.addPage();y=16}d.text(l,15,y);y+=sz*0.5+1.2})};
  W('Regime TT - Defaut d\'isolement',16,true);y+=2;
  W(`Etudiant : ${n} ${p}   |   Groupe : ${g}   |   Date : ${new Date().toLocaleDateString('fr-FR')}`);if($('qst').value.trim())W('Question traitee : '+$('qst').value.trim(),11,true);y+=2;
  d.addImage(await png(),'PNG',15,y,160,118.9);y+=124;
  const s=S();W('Parametres',12,true);W(`RB = ${s.rb} ohms ; RA = ${s.ra} ohms ; Rhomme = ${s.rh} ohms ; ${cfg(s)}`);y+=2;
  W('Mesures',12,true);if(!log.length)W('Aucune mesure effectuee.');log.forEach(l=>W(`- ${l[0]} (${l[1]}) : ${l[2]}  [${l[3]}]`,9));y+=2;
  const v=document.querySelector('input[name=v]:checked');
  W('Conclusion de l\'etudiant',12,true);W(v?(v.value==='1'?'Dangereux':'Pas dangereux'):'Non renseignee');if($('com').value.trim())W($('com').value.trim());y+=2;
  
  const fn=cl(`TT_${n}_${p}.pdf`).replace(/\s+/g,'_'),blob=d.output('blob');
  const dl=window.claude&&await claude.use('downloads');
  if(dl)await dl.save({filename:fn,data:blob});else d.save(fn)}
 catch(e){if(!e||e.code!=='declined')alert('Export PDF impossible : '+(e&&e.message||e))}};
</script></main></body></html>
